<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<style>

@font-face { font-family: Unbounded; src: url("Unbounded-800.ttf") format("truetype"); font-weight: 800; font-display: block; }
@font-face { font-family: Manrope; src: url("Manrope-600.ttf") format("truetype"); font-weight: 600; font-display: block; }

* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #141210; }
body { position: relative; font-family: Unbounded, sans-serif; }
.room { position: absolute; inset: 0; }
.lockup {
  position: absolute;
  left: 0; right: 0;
  top: 54px;
  text-align: center;
  z-index: 4;
}
h1 {
  margin: 0;
  font-weight: 800;
  font-size: 122px;
  line-height: 0.9;
  letter-spacing: -0.035em;
  color: #f4efe6;
  text-shadow: 0 10px 30px rgba(0,0,0,0.45);
}
.row {
  margin-top: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
}
.rule { width: 72px; height: 3px; background: #e8a317; border-radius: 2px; }
h2 {
  margin: 0;
  font-weight: 800;
  font-size: 54px;
  letter-spacing: 0.22em;
  color: #e8a317;
  text-indent: 0.22em;
}
.tag {
  margin: 16px 0 0;
  font-family: Manrope, sans-serif;
  font-weight: 600;
  font-size: 22px;
  letter-spacing: 0.08em;
  color: #d9d0c2;
}
</style>
</head>
